
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - UAIcheguei</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="redefinir_senha.css">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <a href="login.html" class="voltar">← Voltar</a>

            <h1>Redefinir Senha</h1>

            <p class="subtitulo">
                Recupere seu acesso ao UAIcheguei!
            </p>
            <div id="etapaEmail" class="etapa ativa">

                <p class="descricao">Digite seu e-mail:</p>

                <input
                    type="email"
                    id="email"
                    class="campo-form"
                    placeholder="Digite seu e-mail"
                >

                <button class="buton-entrar" onclick="continuarEmail()">
                    Continuar
                </button>

            </div>


            <div id="etapaCodigo" class="etapa">

                <p class="descricao">
                    Digite o código enviado para seu e-mail:
                </p>

                <input
                    type="text"
                    id="codigo"
                    class="campo-form"
                    placeholder="Digite o código"
                >

                <button class="buton-entrar" onclick="continuarCodigo()">
                    Confirmar código
                </button>

            </div>
            <div id="etapaSenha" class="etapa">

                <p class="descricao">Digite sua nova senha:</p>

                <input
                    type="password"
                    id="senha"
                    class="campo-form"
                    placeholder="Digite sua nova senha"
                >

                <input
                    type="password"
                    id="confirmarSenha"
                    class="campo-form"
                    placeholder="Confirme sua nova senha"
                >

                <button class="buton-entrar" onclick="redefinirSenha()">
                    Redefinir senha
                </button>

            </div>

            <p id="mensagem"></p>

        </div>

        <div class="imagem-box">
            <img
                src="https://uploads.onecompiler.io/44g7ujbgc/1787314084228/C%C3%B3pia_de_UAIcheguei__2_-removebg-preview.png"
                alt="Ilustração UAIcheguei"
            >
        </div>

    </div>

    <script>

        function continuarEmail() {
            let email = document.getElementById("email").value;
            let mensagem = document.getElementById("mensagem");

            if (email === "") {
                mensagem.style.color = "red";
                mensagem.innerText = "Digite seu e-mail!";
                return;
            }

            if (!email.includes("@") || !email.includes(".")) {
                mensagem.style.color = "red";
                mensagem.innerText = "Digite um e-mail válido!";
                return;
            }

            mensagem.innerText = "";

            document.getElementById("etapaEmail").classList.remove("ativa");
            document.getElementById("etapaCodigo").classList.add("ativa");
        }

        function continuarCodigo() {
            let codigo = document.getElementById("codigo").value;
            let mensagem = document.getElementById("mensagem");

            if (codigo === "") {
                mensagem.style.color = "red";
                mensagem.innerText = "Digite o código!";
                return;
            }

            mensagem.innerText = "";

            document.getElementById("etapaCodigo").classList.remove("ativa");
            document.getElementById("etapaSenha").classList.add("ativa");
        }

        function redefinirSenha() {
            let senha = document.getElementById("senha").value;
            let confirmarSenha = document.getElementById("confirmarSenha").value;
            let mensagem = document.getElementById("mensagem");

            if (senha === "" || confirmarSenha === "") {
                mensagem.style.color = "red";
                mensagem.innerText = "Preencha os dois campos!";
                return;
            }

            if (senha !== confirmarSenha) {
                mensagem.style.color = "red";
                mensagem.innerText = "As senhas não são iguais!";
                return;
            }

            mensagem.style.color = "green";
            mensagem.innerText = "Senha redefinida com sucesso!";
        }

    </script>

</body>
</html>
