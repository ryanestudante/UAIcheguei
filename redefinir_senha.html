<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir Senha - UAIcheguei</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #e15800;
            background-image: url("https://uploads.onecompiler.io/44g7ujbgc/1787313298296/ChatGPT%20Image%2021%20de%20ago.%20de%202026,%2008_45_55.png");
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            min-height: 100vh;
        }

        .caixa-branca {
            position: relative;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            width: 500px;
            text-align: center;
            color: #333;
            font-size: 0.9em;
            min-height: 650px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .campo-form {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 15px;
            border: 2px solid #666;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
        }

        .campo-form:focus {
            border-color: #e15800;
        }

        .buton-entrar {
            background-color: #e15800;
            padding: 12px;
            border: none;
            border-radius: 20px;
            width: 100%;
            text-align: center;
            color: white;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .buton-entrar:hover {
            background-color: #c94d00;
        }

        .buton-entrar:active {
            transform: translateY(4px);
        }

        .voltar {
            position: absolute;
            left: 20px;
            top: 20px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
        }

        .voltar:hover {
            color: #e15800;
        }

        #mensagem {
            margin-top: 15px;
            color: red;
            font-weight: bold;
        }

        .codigo {
            margin-top: 5px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="caixa-branca">

            <a href="index.html" class="voltar">
                ← Voltar
            </a>

            <br><br>

            <h1>Redefinir Senha</h1>

            <p style="color: #999;">
                No UAIcheguei, o melhor app<br>
                de comida de Minas Gerais
            </p>

            <br>

            <p>
                Digite seu e-mail:
            </p>

            <input
                type="email"
                id="email"
                class="campo-form"
                placeholder="Digite seu e-mail"
            >

            <p>
                Digite o código enviado para seu e-mail:
            </p>

            <input
                type="text"
                id="codigo"
                class="campo-form codigo"
                placeholder="Digite o código"
            >

            <p>
                Digite sua nova senha:
            </p>

            <input
                type="password"
                id="senha"
                class="campo-form"
                placeholder="Digite sua nova senha"
            >

            <input
                type="password"
                id="confirmarSenha"
                class="campo-form"
                placeholder="Confirme sua nova senha"
            >
            <button
                type="button"
                class="buton-entrar"
                onclick="entrar()"
            >
                <h2>Redefinir senha</h2>
            </button>
            <p id="mensagem"></p>
        </div>
    </div>
   

</body>

</html>
