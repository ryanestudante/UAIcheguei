<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAIcheguei — Cadastro</title>
  <style>
    :root {
      --laranja: #e15800;
      --marrom: #4f3011;
    }

    * { box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      overflow-x: hidden;
      background: #ff6500 url("CópiadeUAIcheguei.png") center / cover no-repeat fixed;
      color: #24170e;
      font-family: Arial, sans-serif;
    }

    .form-box {
      width: min(430px, 100%);
      padding: 34px 30px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 14px 35px rgba(79, 48, 17, .22);
    }

    .form-box h1 {
      margin: 0 0 8px;
      color: var(--laranja);
      text-align: center;
    }

    .form-box p { text-align: center; }

    .data-label {
      display: block;
      margin: 12px 8px 0;
      font-size: .9rem;
    }

    .campo-form {
      width: 100%;
      margin: 8px 0;
      padding: 14px 17px;
      border: 2px solid #ddd;
      border-radius: 25px;
      font-size: 1rem;
      outline: none;
    }

    .campo-form:focus { border-color: var(--laranja); }

    .botao {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 25px;
      background: var(--laranja);
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="form-box">
    <h1>Cadastre-se</h1>
    <p>Crie sua conta UAIcheguei</p>
    <form>
      <input class="campo-form" type="text" placeholder="Nome completo" aria-label="Nome completo" autocomplete="name" required>
      <input class="campo-form" type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
      <input class="campo-form" type="tel" placeholder="Número de telefone" aria-label="Número de telefone" autocomplete="tel" required>
      <label class="data-label" for="data-nascimento">Data de nascimento</label>
      <input class="campo-form" id="data-nascimento" type="date" aria-label="Data de nascimento" autocomplete="bday" required>
      <input class="campo-form" type="password" placeholder="Senha" aria-label="Senha" autocomplete="new-password" required>
      <input class="campo-form" type="password" placeholder="Confirme sua senha" aria-label="Confirme sua senha" autocomplete="new-password" required>
      <button class="botao" type="submit">Criar conta</button>
    </form>
  </main>
</body>
</html>
