a">BEM-VINDO AO UAIcheguei</span><h1>Quer explorar nossos sabores?</h1><p>Para continuar e ver as opções de <strong id="categoria">comida</strong>, entre na sua conta ou crie uma gratuitamente.</p><div class="botoes"><a class="botao entrar" href="login.html">Já tenho conta · Entrar</a><a class="botao criar" href="cadastro.html">Sou novo · Criar conta</a></div><a class="voltar" href="principal.html#restaurantes">← Voltar para as categorias</a></section></main><script>const c=new URLSearchParams(location.search).get("categoria");if(c&&c.length<40)document.getElementById("categoria").textContent=c;</script></body></html>
