<!DOCTYPE html>
<html>
<head>
    <title>UAIcheguei</title>

    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        body {
          background-image: url(https://uploads.onecompiler.io/44g7ujbgc/1787313298296/ChatGPT%20Image%2021%20de%20ago.%20de%202026,%2008_45_55.png);

            background-color: #e15800;
            background-image: url(https://uploads.onecompiler.io/44g7ujbgc/1783699274529/C%C3%B3pia%20de%20UAIcheguei%20(1).png);
            background-size: cover;
            background-position: center;
            font-family: Arial;
        }

        .campo-form {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 15px;
            border: 2px solid #666;
            border-radius: 25px;
            box-sizing: border-box;
            font-size: 1em;
            max-width: 100%;
            cursor: pointer;
        }

        .caixa-branca {
            position: relative;
            margin-top: 4%;
            left: 10%;
            background-color: white;
            padding: 10px;
            border-radius: 20px;
            width: 500px;
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-bottom: 25px;
            height: 600px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            z-index: 20;
        }

        .uai_imagem {
            max-width: 100%;
            display: flex;
            margin-bottom: 25px;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            margin-top: 2%;
        }

        .caixa-marrom {
            background-color: #4f3011;
            padding: 1px;
            border-radius: 20px;
            width: 60%;
            text-align: center;
            color: white;
            font-size: 22px;
            margin-bottom: 25%;
            position: relative;
            z-index: 20;
            margin-top: -20px;
        }

        .buton-entrar {
            background-color: #e15800;
            padding: 1%;
            border-radius: 20px;
            width: 98%;
            text-align: center;
            color: black;
            margin-bottom: 25px;
            cursor: pointer;
            display: block;
            text-decoration: none;
        }

        .buton-entrar:hover {
            background-color: #c94d00;
        }

        .buton-entrar:active {
            transform: translateY(4px);
        }

        .buton-entrar h2 {
            margin: 0;
        }

        .laranja {
            color: #e15800;
        }

        .esqueci {
            color: black;
            cursor: pointer;
            text-decoration: underline;
            font-size: 1.25em;
            display: block;
            margin-top: 10px;
        }

        a:hover {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="caixa-branca">

            <h1 style="color: #e15800;">Bem vindo(a)!</h1>

            <h1 style="color: black;">Crie sua conta</h1>

            <p style="color: #D3D3D3;">
                Ao UAIcheguei, o melhor app<br>
                de comida de Minas Gerais
            </p>

            <form>

                <input
                    type="text"
                    class="campo-form"
                    placeholder="CPF:">

                <br>

                <input
                    type="text"
                    class="campo-form"
                    placeholder="Email:">

                <br>

                <input
                    type="password"
                    class="campo-form"
                    placeholder="Senha:">

                <br>

                <input
                    type="password"
                    class="campo-form"
                    placeholder="Confirme a senha:">

                <br>

                <a href="principal.html" class="buton-entrar">
                    <h2>Entrar</h2>
                </a>

                <a href="redefinir_senha.html" class="esqueci">
                    Esqueci a senha
                </a>

            </form>

        </div>

        <div class="uai_imagem">

            <img
                width="800px"
                src="https://uploads.onecompiler.io/44g7ujbgc/1787314084228/C%C3%B3pia_de_UAIcheguei__2_-removebg-preview.png">

            <div class="caixa-marrom">

                <p>
                    O melhor lugar para se pedir comida
                    <span class="laranja">em Minas</span>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
