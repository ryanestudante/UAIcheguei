<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - UAIcheguei</title>
        <link rel="stylesheet" href="login.css">
        <link rel="stylesheet" href="responsivo.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="acesso-novo.css">
    </head>
    <body>
        <div class="container">
            <div class="caixa-branca">
                <a class="voltar-inicio" href="principal.html">← Voltar para o início</a>
                <h1>Que bom ter você aqui!</h1>
                <h2>Entre e aproveite os sabores de Minas</h2>
                <p class="descricao">
                    Faça seu login no UAIcheguei e descubra
                    o melhor da comida de Minas Gerais!
                </p>
                <form onsubmit="entrar(); return false;">
                    <input
                    type="text"
                    id="CPF"
                    autocomplete="off"
                    aria-label="CPF de demonstração"
                    class="campo-form"
                    placeholder="CPF"
                    >
                    <input
                    type="email"
                    id="Email"
                    autocomplete="username"
                    class="campo-form"
                    placeholder="E-mail"
                    >
                    <input
                    type="password"
                    id="Senha"
                    autocomplete="current-password"
                    class="campo-form"
                    placeholder="Senha"
                    >
                    <button
                        type="submit"
                        class="buton-entrar"
                        >
                        Entrar
                    </button>
                    <div id="mensagem" role="status" aria-live="polite">
                    </div>
                    <a href="recuperar-senha.html" class="esqueci">
                        Esqueci minha senha
                    </a>
                    <a href="cadastro.html" class="criar-conta">
                        Ainda não tem uma conta?
                        <span>Criar conta</span>
                    </a>
                </form>
            </div>
            <div class="uai_imagem">
                <img
                src="https://uploads.onecompiler.io/44g7ujbgc/1787314084228/C%C3%B3pia_de_UAIcheguei__2_-removebg-preview.png"
                alt="UAIcheguei"
                >
                <div class="caixa-marrom">
                    O melhor lugar para pedir comida
                    <span class="laranja">em Minas!</span>
                </div>
            </div>
        </div>
        <script>

function entrar() {

    let cpf = document.getElementById("CPF").value.trim();
    let gmail = document.getElementById("Email").value.trim().toLowerCase();
    let senha = document.getElementById("Senha").value;

    if (cpf === "" || gmail === "" || senha === "") {
        document.getElementById("mensagem").innerHTML = "Preencha todos os campos.";
        return;
    }

    if (cpf === "12345678900" && gmail === "cliente@gmail.com" && senha === "123456") {
        window.location.href = "cliente.html";
    }

    else if (cpf === "98765432100" && gmail === "dono@gmail.com" && senha === "123456") {
        window.location.href = "administrador.html";
    }

    else if (cpf === "11122233344" && gmail === "entregador@gmail.com" && senha === "123456") {
        window.location.href = "entregador.html";
    }

    else {
        document.getElementById("mensagem").innerHTML = "CPF, e-mail ou senha não conferem.";
    }

}

</script>
    </body>
</html>
