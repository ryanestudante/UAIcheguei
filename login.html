
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>Login - UAIcheguei</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
background-image: url(https://uploads.onecompiler.io/44g7ujbgc/1787313298296/ChatGPT%20Image%2021%20de%20ago.%20de%202026,%2008_45_55.png);

    font-family: 'Poppins', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 1150px;
    min-height: 650px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    background: white;
    padding: 45px;
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(79, 48, 17, 0.10);
}
.caixa-branca {
    width: 430px;
    padding: 15px;
    text-align: center;
}

.logo {
    width: 120px;
    margin-bottom: 20px;
}

.caixa-branca h1 {
    font-size: 30px;
    color: #e15800;
    margin-bottom: 5px;
}

.caixa-branca h2 {
    font-size: 24px;
    color: #4f3011;
    margin-bottom: 10px;
}

.descricao {
    color: #999;
    font-size: 13px;
    margin-bottom: 30px;
    line-height: 1.7;
}

.campo-form {
    width: 100%;
    padding: 15px 18px;
    margin-bottom: 17px;
    border: 1px solid #eee;
    border-radius: 12px;
    background: #fafafa;
    outline: none;
    font-family: Poppins;
    font-size: 13px;
    transition: 0.3s;
}

.campo-form:focus {
    border-color: #e15800;
    background: white;
    box-shadow: 0 0 0 3px #e1580015;
}

.campo-form::placeholder {
    color: #aaa;
}

.buton-entrar {
    width: 100%;
    padding: 14px;
    margin-top: 5px;
    background: #e15800;
    color: white;
    border: none;
    border-radius: 12px;
    font-family: Poppins;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.buton-entrar:hover {
    background: #c94d00;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px #e1580030;
}

.buton-entrar:active {
    transform: scale(0.98);
}

#mensagem {
    color: #d62828;
    font-size: 12px;
    margin-top: 12px;
}

.esqueci {
    display: block;
    margin-top: 18px;
    color: #e15800;
    text-decoration: none;
    font-size: 13px;
}

.esqueci:hover {
    text-decoration: underline;
}

.criar-conta {
    display: block;
    margin-top: 20px;
    color: #777;
    font-size: 13px;
    text-decoration: none;
}

.criar-conta span {
    color: #e15800;
    font-weight: 600;
}

.criar-conta:hover span {
    text-decoration: underline;
}

/* IMAGEM */

.uai_imagem {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f27029;
    border-radius: 22px;
    padding: 35px;
    min-height: 520px;
}

.uai_imagem img {
    width: 100%;
    max-width: 500px;
    object-fit: contain;
}

.caixa-marrom {
    background: #4f3011;
    color: white;
    padding: 15px 25px;
    border-radius: 15px;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    margin-top: 15px;
}

.laranja {
    color: #f27029;
}

/* RESPONSIVIDADE */

@media (max-width: 850px) {
    body {
        padding: 15px;
    }

    .container {
        max-width: 500px;
        padding: 30px 20px;
    }

    .caixa-branca {
        width: 100%;
    }

    .uai_imagem {
        display: none;
    }
}

@media (max-width: 500px) {
    .container {
        padding: 25px 15px;
        border-radius: 18px;
    }

    .caixa-branca h1 {
        font-size: 26px;
    }

    .caixa-branca h2 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="caixa-branca">

        <h1>Bem-vindo(a)!</h1>
        <h2>Entre na sua conta</h2>

        <p class="descricao">
            Faça seu login no UAIcheguei e descubra
            o melhor da comida de Minas Gerais!
        </p>

        <form>

            <input
                type="text"
                id="CPF"
                class="campo-form"
                placeholder="CPF"
            >

            <input
                type="email"
                id="Email"
                class="campo-form"
                placeholder="E-mail"
            >

            <input
                type="password"
                id="Senha"
                class="campo-form"
                placeholder="Senha"
            >

            <input
                type="password"
                id="ConfirmarSenha"
                class="campo-form"
                placeholder="Confirme sua senha"
            >

            <button
                type="button"
                onclick="entrar()"
                class="buton-entrar"
            >
                Entrar
            </button>

            <div id="mensagem"></div>

            <a href="redefinir_senha.html" class="esqueci">
                Esqueci minha senha
            </a>

            <a href="cria.html" class="criar-conta">
                Ainda não tem uma conta?
                <span>Criar conta</span>
            </a>

        </form>

    </div>

    <div class="uai_imagem">

        <img
            src="https://uploads.onecompiler.io/44g7ujbgc/1787314084228/C%C3%B3pia_de_UAIcheguei__2_-removebg-preview.png"
            alt="UAIcheguei"
        >

        <div class="caixa-marrom">
            O melhor lugar para pedir comida
            <span class="laranja">em Minas!</span>
        </div>

    </div>

</div>

<script>

function entrar() {

    let cpf = document.getElementById("CPF").value.trim();
    let gmail = document.getElementById("Email").value.trim().toLowerCase();
    let senha = document.getElementById("Senha").value;
    let confirmarSenha = document.getElementById("ConfirmarSenha").value;

    if (cpf === "" || gmail === "" || senha === "" || confirmarSenha === "") {
        document.getElementById("mensagem").innerHTML = "Preencha todos os campos.";
        return;
    }

    if (senha !== confirmarSenha) {
        document.getElementById("mensagem").innerHTML = "As senhas não conferem.";
        return;
    }

    if (cpf === "12345678900" && gmail === "cliente@gmail.com" && senha === "123456") {
        window.location.href = "principal.html";
    }

    else if (cpf === "98765432100" && gmail === "dono@gmail.com" && senha === "123456") {
        window.location.href = "intranet_adm.html";
    }

    else if (cpf === "11122233344" && gmail === "entregador@gmail.com" && senha === "123456") {
        window.location.href = "intranet_entregador.html";
    }

    else {
        document.getElementById("mensagem").innerHTML = "CPF, e-mail ou senha não conferem.";
    }

}

</script>

</body>
</html>
