
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<title>Cadastro - UAIcheguei</title>

<link rel="stylesheet" href="cria.css">
    <link rel="stylesheet" href="responsivo.css">
</head>

<body>

<div class="container">

    <main class="form-box">

        <h1>Crie sua conta!</h1>

        <p>
            Faça parte do UAIcheguei e descubra
            o melhor da comida de Minas Gerais.
        </p>

        <form>

            <input
                class="campo-form"
                id="nome"
                type="text"
                placeholder="Nome completo"
                required
            >

            <input
                class="campo-form"
                id="Email"
                type="email"
                placeholder="E-mail"
                required
            >

            <input
                class="campo-form"
                id="telefone"
                type="tel"
                placeholder="Número de telefone"
                required
            >

            <label class="data-label" for="data-nascimento">
                Data de nascimento
            </label>

            <input
                class="campo-form"
                id="data-nascimento"
                type="date"
                required
            >

            <input
                class="campo-form"
                id="Senha"
                type="password"
                placeholder="Senha"
                required
            >

            <input
                class="campo-form"
                id="ConfirmarSenha"
                type="password"
                placeholder="Confirme sua senha"
                required
            >

            <button
                class="botao"
                type="button"
                onclick="entrar()"
            >
                Criar conta
            </button>

            <div id="mensagem"></div>

            <a href="login.html" class="voltar">
                ← Voltar para o login
            </a>

        </form>

    </main>

    <div class="uai-imagem">

        <img
            src="https://uploads.onecompiler.io/44g7ujbgc/1787314084228/C%C3%B3pia_de_UAIcheguei__2_-removebg-preview.png"
            alt="UAIcheguei"
        >

        <div class="caixa-marrom">
            O melhor lugar para pedir comida
            <span class="laranja">em Minas!</span>
        </div>

    </div>

</div>

<script>

function entrar() {

    let nome = document.getElementById("nome").value.trim();

    let gmail = document.getElementById("Email").value.trim().toLowerCase();

    let telefone = document.getElementById("telefone").value.trim();

    let data = document.getElementById("data-nascimento").value;

    let senha = document.getElementById("Senha").value;

    let confirmarSenha = document.getElementById("ConfirmarSenha").value;

    if (
        nome === "" ||
        gmail === "" ||
        telefone === "" ||
        data === "" ||
        senha === "" ||
        confirmarSenha === ""
    ) {
        document.getElementById("mensagem").innerHTML =
            "Preencha todos os campos.";
        return;
    }

    if (senha !== confirmarSenha) {
        document.getElementById("mensagem").innerHTML =
            "As senhas não conferem.";
        return;
    }

    if (gmail === "cliente@gmail.com" && senha === "123456") {
        window.location.href = "index.html";
    }

    else if (gmail === "dono@gmail.com" && senha === "123456") {
        window.location.href = "intranet_adm.html";
    }

    else if (gmail === "entregador@gmail.com" && senha === "123456") {
        window.location.href = "intranet_entregador.html";
    }

    else {
        document.getElementById("mensagem").innerHTML =
            "Não foi possível criar a conta.";
    }

}

</script>

</body>
</html>
