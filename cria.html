<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAIcheguei — Cadastro</title>

<style>
:root {
    --laranja: #e15800;
    --marrom: #4f3011;
}

* {
    box-sizing: border-box;
}

body {
    background-image: url("https://uploads.onecompiler.io/44g7ujbgc/1787313298296/ChatGPT%20Image%2021%20de%20ago.%20de%202026,%2008_45_55.png");
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    color: #24170e;
    font-family: Arial, sans-serif;
}

.form-box {
    position: relative;
    width: min(430px, 100%);
    padding: 34px 30px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 14px 35px rgba(79, 48, 17, 0.22);
}

.voltar {
    position: absolute;
    top: 14px;
    left: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid var(--laranja);
    border-radius: 50%;
    color: var(--laranja);
    font-size: 2rem;
    line-height: 1;
    padding-bottom: 8px;
    text-decoration: none;
}

.voltar:hover {
    background-color: var(--laranja);
    color: white;
}

.form-box h1 {
    margin: 0 0 8px;
    color: var(--laranja);
    text-align: center;
}

.form-box p {
    text-align: center;
}

.data-label {
    display: block;
    margin: 12px 8px 0;
    font-size: 0.9rem;
}

.campo-form {
    width: 100%;
    margin: 8px 0;
    padding: 14px 17px;
    border: 2px solid #ddd;
    border-radius: 25px;
    font-size: 1rem;
    outline: none;
}

.campo-form:focus {
    border-color: var(--laranja);
}

.botao {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 0;
    border-radius: 25px;
    background-color: var(--laranja);
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
}

.botao:hover {
    background-color: #c94d00;
}

#mensagem {
    margin-top: 12px;
    text-align: center;
    color: red;
    font-size: 15px;
}
</style>
</head>

<body>

<main class="form-box">

    <a class="voltar" href="index.html" aria-label="Voltar">←</a>

    <h1>Cadastre-se</h1>

    <p>Crie sua conta UAIcheguei</p>

    <form>

        <input
            class="campo-form"
            id="nome"
            type="text"
            placeholder="Nome completo"
            required
        >

        <input
            class="campo-form"
            id="Email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            class="campo-form"
            id="telefone"
            type="tel"
            placeholder="Número de telefone"
            required
        >

        <label class="data-label" for="data-nascimento">
            Data de nascimento
        </label>

        <input
            class="campo-form"
            id="data-nascimento"
            type="date"
            required
        >

        <input
            class="campo-form"
            id="Senha"
            type="password"
            placeholder="Senha"
            required
        >

        <input
            class="campo-form"
            id="ConfirmarSenha"
            type="password"
            placeholder="Confirme sua senha"
            required
        >

        <button
            class="botao"
            type="button"
            onclick="entrar()"
        >
            Criar conta
        </button>

        <div id="mensagem"></div>

    </form>

</main>

<script>

function entrar() {

    let nome = document.getElementById("nome").value.trim();

    let gmail = document.getElementById("Email").value.trim().toLowerCase();

    let telefone = document.getElementById("telefone").value.trim();

    let data = document.getElementById("data-nascimento").value;

    let senha = document.getElementById("Senha").value;

    let confirmarSenha = document.getElementById("ConfirmarSenha").value;


    if (
        nome === "" ||
        gmail === "" ||
        telefone === "" ||
        data === "" ||
        senha === "" ||
        confirmarSenha === ""
    ) {
        document.getElementById("mensagem").innerHTML =
            "Preencha todos os campos.";
        return;
    }
    if (senha !== confirmarSenha) {
        document.getElementById("mensagem").innerHTML =
            "As senhas não conferem.";
        return;
    }
    if (gmail === "cliente@gmail.com" && senha === "123456") {
        window.location.href = "principal.html";
    }
    else if (gmail === "dono@gmail.com" && senha === "123456") {
        window.location.href = "Intranet_adm.html";
    }
    else if (gmail === "entregador@gmail.com" && senha === "123456") {
        window.location.href = "intranet_entregador.html";
    }
    else {
        document.getElementById("mensagem").innerHTML =
            "Email ou senha não conferem.";
    }

}
</script>

</body>
</html>
