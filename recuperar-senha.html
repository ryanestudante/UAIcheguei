<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Recuperar senha | UAIcheguei</title>
    <link rel="stylesheet" href="redefinir_senha.css">
    <link rel="stylesheet" href="responsivo.css">
    <link rel="stylesheet" href="tema-escuro.css">
    <link rel="stylesheet" href="acesso-novo.css">
    <link rel="stylesheet" href="logo-global.css">
    <link rel="stylesheet" href="acesso-funcional.css?v=1">
    <script src="acesso-local.js?v=1" defer></script>
</head>
<body>
    <main class="container">
        <section class="form-box">
            <a href="login.html" class="voltar">← Voltar para o login</a>
            <img class="marca-formulario" src="img/logo.png" alt="Logo original do UAIcheguei">
            <h1>Recupere seu acesso</h1>
            <p class="subtitulo">Informe o código de recuperação recebido no momento do cadastro.</p>

            <form id="form-recuperacao">
                <label class="rotulo-acesso" for="email">E-mail cadastrado</label>
                <input class="campo-form" id="email" type="email" placeholder="Seu e-mail" autocomplete="email" required>

                <label class="rotulo-acesso" for="codigo">Código de recuperação</label>
                <input class="campo-form" id="codigo" type="text" placeholder="Código recebido no cadastro" autocomplete="off" required>

                <label class="rotulo-acesso" for="senha">Nova senha</label>
                <input class="campo-form" id="senha" type="password" placeholder="Pelo menos 8 caracteres" autocomplete="new-password" minlength="8" required>

                <label class="rotulo-acesso" for="confirmar-senha">Confirmar nova senha</label>
                <input class="campo-form" id="confirmar-senha" type="password" placeholder="Repita a nova senha" autocomplete="new-password" minlength="8" required>

                <button class="buton-entrar" type="submit">Redefinir senha</button>
                <p id="mensagem" class="mensagem-acesso" role="status" aria-live="polite"></p>
            </form>

            <p class="aviso-local">Não enviamos códigos por e-mail. Utilize o código fornecido ao criar sua conta neste dispositivo.</p>
        </section>

        <aside class="imagem-box" aria-label="Identidade do UAIcheguei">
            <img class="logo-destaque" src="img/logo.png" alt="Logo original do UAIcheguei">
            <div class="caixa-marrom">Seu cantinho de sabores <span class="laranja">mineiros!</span></div>
        </aside>
    </main>
</body>
</html>
