<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Redefinir Senha - UAIcheguei</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="redefinir_senha.css">
        <link rel="stylesheet" href="responsivo.css">
        <link rel="stylesheet" href="tema-escuro.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="acesso-novo.css">
    <link rel="stylesheet" href="logo-global.css"></head>
    <body>
        <div class="container">
            <div class="form-box">
                <a href="login.html" class="voltar">← Voltar</a>
                <h1>Recupere seu acesso</h1>
                <p class="subtitulo">
                    Recupere seu acesso ao UAIcheguei!
                </p>
                <div id="etapaEmail" class="etapa ativa">
                    <p class="descricao">Digite seu e-mail:</p>
                    <input
                    type="email"
                    id="email"
                    class="campo-form"
                    placeholder="Digite seu e-mail"
                    >
                    <button type="button" class="buton-entrar" disabled>
                        Continuar
                    </button>
                </div>

                <p class="descricao">Recuperação de senha demonstrativa: o envio de e-mails não está disponível.</p>
            </div>
            <div class="imagem-box">
                <img
                src="img/logo-acesso.svg"
                alt="Ilustração UAIcheguei"
                >
                <div class="caixa-marrom">Seu cantinho de sabores <span class="laranja">mineiros!</span>
                </div>
            </div>
        </div>
        
    </body>
</html>
