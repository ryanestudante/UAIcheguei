<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <title>Cadastro - UAIcheguei</title>
        <link rel="stylesheet" href="cria.css">
        <link rel="stylesheet" href="responsivo.css">
        <link rel="stylesheet" href="tema-escuro.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="acesso-novo.css">
    <link rel="stylesheet" href="logo-global.css">
</head>
    <body>
        <div class="container">
            <main class="form-box">
                <a href="principal.html" class="voltar">← Voltar ao início</a>
                <h1>Faça parte do UAIcheguei</h1>
                <p>
                    Faça parte do UAIcheguei e descubra
                    o melhor da comida de Minas Gerais.
                </p>
                <form onsubmit="entrar(); return false;">
                    <input
                    class="campo-form"
                    id="nome"
                    type="text"
                    placeholder="Nome completo"
                    required
                    >
                    <input
                    class="campo-form"
                    id="Email"
                    type="email"
                    placeholder="E-mail"
                    required
                    >
                    <input
                    class="campo-form"
                    id="telefone"
                    type="tel"
                    placeholder="Número de telefone"
                    required
                    >
                    <label class="data-label" for="data-nascimento">
                        Data de nascimento
                    </label>
                    <input
                    class="campo-form"
                    id="data-nascimento"
                    type="date"
                    required
                    >
                    <input
                    class="campo-form"
                    id="Senha"
                    type="password"
                    placeholder="Senha"
                    required
                    >
                    <input
                    class="campo-form"
                    id="ConfirmarSenha"
                    type="password"
                    placeholder="Confirme sua senha"
                    required
                    >
                    <button
                        class="botao"
                        type="submit"
                        >
                        Criar conta
                    </button>
                    <div id="mensagem" role="status" aria-live="polite">
                    </div>
                    <a href="login.html" class="voltar">
                        ← Voltar para o login
                    </a>
                </form>
            </main>
            <div class="uai-imagem">
                <img
                src="logo.png"
                alt="UAIcheguei"
                >
                <div class="caixa-marrom">
                    O melhor lugar para pedir comida
                    <span class="laranja">em Minas!</span>
                </div>
            </div>
        </div>
        <script>
    function entrar() {
        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("Email").value.trim().toLowerCase();
        const telefone = document.getElementById("telefone").value.trim();
        const nascimento = document.getElementById("data-nascimento").value;
        const senha = document.getElementById("Senha").value;
        const confirmacao = document.getElementById("ConfirmarSenha").value;
        const mensagem = document.getElementById("mensagem");

        if (!nome || !email || !telefone || !nascimento || !senha || !confirmacao) {
            mensagem.textContent = "Preencha todos os campos.";
            return;
        }

        if (senha !== confirmacao) {
            mensagem.textContent = "As senhas não conferem.";
            return;
        }

        // Cadastro ilustrativo: ainda não salva novos usuários.
        mensagem.textContent = "Cadastro demonstrativo. Para criar uma conta de verdade, é necessário conectar um banco de dados.";
    }
</script>
    </body>
</html>
